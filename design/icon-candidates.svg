  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle">
    <text x="260" y="724" font-size="34" font-weight="760" fill="#0067c0">01</text>
    <text x="260" y="779" font-size="27" font-weight="680" fill="#1b2b40">浏览窗口</text>
    <text x="260" y="821" font-size="20" font-weight="450" fill="#718196">最直观 · 功能感强</text>

    <text x="630" y="724" font-size="34" font-weight="760" fill="#0067c0">02</text>
    <text x="630" y="779" font-size="27" font-weight="680" fill="#1b2b40">路径导航</text>
    <text x="630" y="821" font-size="20" font-weight="450" fill="#718196">探索感 · 方向明确</text>

    <text x="1000" y="724" font-size="34" font-weight="760" fill="#0067c0">03</text>
    <text x="1000" y="779" font-size="27" font-weight="680" fill="#1b2b40">多标签分层</text>
    <text x="1000" y="821" font-size="20" font-weight="450" fill="#718196">秩序感 · 轻盈现代</text>

    <text x="1370" y="724" font-size="34" font-weight="760" fill="#0067c0">04</text>
    <text x="1370" y="779" font-size="27" font-weight="680" fill="#1b2b40">跨平台通道</text>
    <text x="1370" y="821" font-size="20" font-weight="450" fill="#718196">故事性 · 辨识鲜明</text>

    <text x="1740" y="724" font-size="34" font-weight="760" fill="#0067c0">05</text>
    <text x="1740" y="779" font-size="27" font-weight="680" fill="#1b2b40">蓝金咬合</text>
    <text x="1740" y="821" font-size="20" font-weight="450" fill="#718196">轮廓强 · 小尺寸清楚</text>
  </g>

  <rect x="100" y="962" width="1800" height="1" fill="#cbd5e1"/>
  <text x="100" y="1020" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="500" fill="#718196">概念稿 · 尚未替换项目现有图标</text>
