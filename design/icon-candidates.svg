      <path d="M190 553h102" stroke="#0b70c9" stroke-width="22" stroke-linecap="round"/>
      <path d="M282 526l38 27-38 27z" fill="#0b70c9"/>
      <path d="M166 489h220" stroke="#fff4c8" stroke-width="5" opacity="0.55"/>
