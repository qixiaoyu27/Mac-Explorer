      <path d="M1643 440c20-33 47-51 78-51 28 0 48 14 59 39 12-25 32-39 60-39 22 0 42 9 59 27v91c-16-25-35-37-58-37-26 0-47 17-61 50-14-33-35-50-62-50-31 0-56 17-75 52z" fill="url(#blue)"/>
