<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1120" viewBox="0 0 2000 1120">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e9eef5"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.58" stop-color="#f5f8fc"/>
      <stop offset="1" stop-color="#dce5f1"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#ffd96a"/>
      <stop offset="0.56" stop-color="#f4b92e"/>
      <stop offset="1" stop-color="#dc8e0d"/>
    </linearGradient>
    <linearGradient id="goldFront" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe17c"/>
      <stop offset="0.55" stop-color="#ffc94f"/>
      <stop offset="1" stop-color="#ee9f19"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#36b7ff"/>
      <stop offset="0.45" stop-color="#087bd2"/>
      <stop offset="1" stop-color="#0052a2"/>
